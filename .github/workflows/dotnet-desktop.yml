name: Build GTAHudMod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download LabFusion.dll from Release
        run: curl -L -o LabFusion.dll "PASTE_YOUR_RELEASE_ASSET_URL_HERE"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build GTAHudMod.csproj -c Release

      - name: Upload built DLL
        uses: actions/upload-artifact@v4
        with:
          name: GTAHudMod
          path: bin/Release/net8.0/GTAHudMod.dll
